# Pontis Configuration
# Copy to ~/.pontis/config.yml or project-level pontis.yml

# Extractor profile (cheap model for metadata/summaries)
extractor_provider: "https://api.deepseek.com"
extractor_model: "deepseek-chat"
extractor_api_key: ""

# Agent profile (capable model for interactive analysis)
agent_provider: "https://api.deepseek.com"
agent_model: "deepseek-reasoner"
agent_api_key: ""

# Extraction settings
sample_size: 5
top_k: 5
log_level: "INFO"
