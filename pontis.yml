# Neo4j graph routing.
#
# Community / local per-project mode:
#   Use one Neo4j process per project. Each project gets a different bolt port
#   and keeps database: neo4j.
#
# Community / local shared mode:
#   Multiple logical projects can point to the same bolt port and keep
#   database: neo4j. Pontis isolates them by the reserved project property.
#   Spider2-Snow uses this mode.
#
# Enterprise / single-process mode:
#   Point projects at the same uri and set graph.database to different database
#   names, for example california-schools, card-games, bird.
graph_defaults: &neo4j_graph
  uri: bolt://localhost:7687
  database: neo4j
  user: neo4j
  password_env: NEO4J_PASSWORD

postgresql_source_defaults: &postgresql_source
  type: postgresql
  host: 127.0.0.1
  port: 55432
  user: root
  password: "123123"
  connect_timeout: 5

