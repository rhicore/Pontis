# Neo4j graph routing.
#
# Community / local mode:
#   Use one Neo4j process per project. Each project gets a different bolt port
#   and keeps database: neo4j.
#
# Enterprise / single-process mode:
#   Point projects at the same uri and set graph.database to different database
#   names, for example california-schools, card-games, bird.
graph_defaults: &neo4j_graph
  database: neo4j
  user: neo4j
  password_env: NEO4J_PASSWORD

projects:
  bird:
    graph:
      <<: *neo4j_graph
      uri: bolt://localhost:7687
  california_schools:
    source:
      type: fs
      path: example_data/bird_dev/dev_databases/california_schools
    graph:
      <<: *neo4j_graph
      uri: bolt://localhost:7688
  card_games:
    source:
      type: fs
      path: example_data/bird_dev/dev_databases/card_games
    graph:
      <<: *neo4j_graph
      uri: bolt://localhost:7689
