<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620">
<defs>
<marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L9,3 z" fill="#64748b" />
</marker>
</defs>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="40" y="46" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="800" fill="#0f172a">SQL to Graph: parsing process</text>
<rect x="40" y="90" width="350" height="440" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="64" y="126" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800" fill="#0f172a">1. SQL text</text>
<text x="64" y="162" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#475569">WITH customer_spend AS (SELECT</text>
<text x="64" y="186" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#475569">c.customer_id, c.region, SUM(oi.quantity *</text>
<text x="64" y="210" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#475569">oi.unit_price) AS spend FROM customers c</text>
<text x="64" y="234" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#475569">JOIN orders o ON c.customer_id =</text>
<text x="64" y="258" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#475569">o.customer_id JOIN order_items oi ON</text>
<text x="64" y="282" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#475569">o.order_id = oi.order_id JOIN products p</text>
<text x="64" y="306" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#475569">ON oi.product_id = p.product_id WHERE</text>
<text x="64" y="330" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#475569">o.order_date &gt;= &#x27;2024-01-01&#x27; AND</text>
<text x="64" y="354" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#475569">o.order_date &lt; &#x27;2025-01-01&#x27; AND p.category</text>
<text x="64" y="378" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#475569">= &#x27;Electronics&#x27; GROUP BY c.customer_id,</text>
<text x="64" y="402" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#475569">c.region) SELECT region, COUNT(*) AS</text>
<text x="64" y="426" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#475569">customer_count FROM customer_spend WHERE</text>
<text x="64" y="450" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#475569">spend &gt; 10000 GROUP BY region ORDER BY</text>
<text x="64" y="474" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#475569">customer_count DESC</text>
<rect x="465" y="90" width="350" height="440" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="489" y="126" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800" fill="#0f172a">2. AST / syntax tree</text>
<text x="489" y="162" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#475569">Compiler view: SQL text -&gt; parse tree</text>
<text x="489" y="186" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#475569">Main nodes:</text>
<text x="489" y="210" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#475569">- WITH</text>
<text x="489" y="234" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#475569">- EXPRESSIONS</text>
<text x="489" y="258" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#475569">- FROM</text>
<text x="489" y="282" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#475569">- WHERE</text>
<text x="489" y="306" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#475569">- GROUP</text>
<text x="489" y="330" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#475569">- ORDER</text>
<rect x="890" y="90" width="350" height="440" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="914" y="126" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800" fill="#0f172a">3. Operator graph</text>
<text x="914" y="162" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#475569">Relational view: SQL -&gt; data operations</text>
<text x="914" y="186" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#475569">Typical operators:</text>
<text x="914" y="210" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#475569">- Scan tables</text>
<text x="914" y="234" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#475569">- Join relations</text>
<text x="914" y="258" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#475569">- Filter rows</text>
<text x="914" y="282" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#475569">- Group/Aggregate</text>
<text x="914" y="306" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#475569">- Project output</text>
<text x="914" y="330" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#475569">- Sort</text>
<path d="M405,310 L450,310" stroke="#64748b" stroke-width="3" marker-end="url(#arrow2)"/>
<path d="M830,310 L875,310" stroke="#64748b" stroke-width="3" marker-end="url(#arrow2)"/>
<text x="640" y="570" font-family="Inter,Arial,sans-serif" font-size="16" text-anchor="middle" fill="#475569">AST explains how SQL text is structured; the operator graph explains what the SQL does to data.</text>
</svg>